name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet restore SmartInventory.slnx
      - run: dotnet build SmartInventory.slnx --configuration Release --no-restore

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/smartinventory-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/smartinventory-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
